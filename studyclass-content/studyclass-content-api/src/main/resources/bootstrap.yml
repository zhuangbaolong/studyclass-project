#微服务配置
spring:
  application:
    name: content-api #配置文件1.服务名 组合content-api-dev.yml
  cloud:
    nacos:
      server-addr: 192.168.88.130:8848
      discovery: #服务注册
        namespace: dev
        group: studyclass-project
        username: nacos
        password: nacos
      config: #配置文件相关信息
        namespace: dev
        group: studyclass-project
        file-extension: yml
        refresh-enabled: true
        extension-configs:
          - data-id: content-service-${spring.profiles.active}.yml
            group: studyclass-project
            refresh: true
        shared-configs:
          - data-id: swagger-${spring.profiles.active}.yml
            group: studyclass-common
            refresh: true
          - data-id: logging-${spring.profiles.active}.yml
            group: studyclass-common
            refresh: true
          - data-id: freemarker-config-dev.yml
            group: studyclass-common
            refresh: true
  profiles:
    active: dev #配置文件2.环境名
