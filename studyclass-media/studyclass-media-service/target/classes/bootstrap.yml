spring:
  application:
    name: media-service
  cloud:
    nacos:
      server-addr: 192.168.88.130:8848
      discovery:
        namespace: ${spring.profiles.active}
        group: studyclass-project
      config:
        namespace: ${spring.profiles.active}
        group: studyclass-project
        file-extension: yml
        refresh-enabled: true
      shared-configs:
        - data-id: logging-${spring.profiles.active}.yml
          group: studyclass-common
          refresh: true

#profiles默认为dev
  profiles:
    active: dev



