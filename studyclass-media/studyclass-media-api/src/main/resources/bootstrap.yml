#微服务配置
spring:
  application:
    name: media-api
  cloud:
    nacos:
      server-addr: 192.168.88.130:8848
      discovery:
        namespace: dev
        group: studyclass-project
        username: nacos
        password: nacos
      config:
        namespace: dev
        group: studyclass-project
        file-extension: yml
        refresh-enabled: true
        extension-configs:
          - data-id: media-service-${spring.profiles.active}.yml
            group: studyclass-project
            refresh: true
        shared-configs:
          - data-id: swagger-${spring.profiles.active}.yml
            group: studyclass-common
            refresh: true
          - data-id: logging-${spring.profiles.active}.yml
            group: studyclass-common
            refresh: true
  profiles:
    active: dev

